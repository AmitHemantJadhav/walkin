<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Walk-In</title>
<style>
  :root { --bg: rgba(18,18,22,.78); --fg: #f4f2ee; --muted: #a9a5a0; --accent: #ff5a5f; --ok: #3ccf8e; --bad: #ff5a5f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--fg);
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; touch-action: none; }
  canvas { display: block; }
  .panel { position: fixed; background: var(--bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 14px; padding: 10px 12px; }
  #info { top: 12px; left: 12px; max-width: 46vw; }
  #info h1 { margin: 0; font-size: 15px; letter-spacing: .02em; }
  #info .sub { color: var(--muted); font-size: 12px; }
  #room { margin-top: 6px; font-weight: 600; }
  #fit { margin-top: 4px; font-size: 13px; }
  #fit.ok { color: var(--ok); } #fit.bad { color: var(--bad); }
  #bar { bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 6px;
    justify-content: center; max-width: 96vw; }
  button { background: #2a2a31; color: var(--fg); border: 0; border-radius: 10px; padding: 8px 11px; font: inherit;
    font-size: 13px; cursor: pointer; white-space: nowrap; }
  button:hover { background: #3a3a43; }
  button.on { background: var(--accent); }
  .sep { width: 1px; background: #444; margin: 2px 2px; }
  #debug { top: 12px; right: 12px; font: 12px/1.4 ui-monospace, Menlo, monospace; max-width: 40vw; display: none; white-space: pre-wrap; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #000; z-index: 10; font-size: 16px; }
  #exitvr { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: none; z-index: 5; opacity: .7; }
  body.vr #info, body.vr #bar, body.vr #debug { display: none !important; }
  body.vr #exitvr { display: block; }
  #handcam { position: fixed; right: 12px; top: 12px; width: 150px; max-width: 30vw; border-radius: 10px; display: none; opacity: .85; z-index: 3; }
  body.vr #handcam { display: none !important; }
</style>
<link rel="stylesheet" href="ui.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">Loading house…</div>

<div id="info" class="panel">
  <h1>Walk-In</h1>
  <div class="sub" id="house">—</div>
  <div id="room">—</div>
  <div id="fit"></div>
</div>

<div id="debug" class="panel"></div>
<video id="handcam" playsinline muted></video>
<button id="exitvr">Exit headset</button>

<div id="bar" class="panel dock" role="toolbar" aria-label="Walk-In controls">
  <button id="bAdd" class="dock-btn" aria-haspopup="true" aria-expanded="false" aria-controls="addPop" title="Add furniture">＋ Add</button>
  <button id="bEmpty" class="dock-btn toggle on" title="Show the house empty (defurnished) or as scanned">Empty</button>
  <button id="bHands" class="dock-btn toggle" title="Pinch to grab furniture (both hands: twist to rotate)">✋ Hands</button>
  <button id="bVR" class="dock-btn toggle" title="Side-by-side view for a phone headset">🥽 Headset</button>
  <button id="bMore" class="dock-btn" aria-haspopup="true" aria-expanded="false" aria-controls="morePop" title="More">⋯</button>
</div>

<div id="addPop" class="glass pop" role="menu" aria-label="Add furniture" hidden>
  <div class="pop-title">Add</div>
  <div class="pop-grid">
    <button data-add="sofa">Sofa</button>
    <button data-add="armchair">Armchair</button>
    <button data-add="coffeetable">Coffee table</button>
    <button data-add="queen">Queen bed</button>
    <button data-add="king">King bed</button>
    <button data-add="nightstand">Nightstand</button>
    <button data-add="table">Dining table</button>
    <button data-add="chair">Chair</button>
    <button data-add="desk">Desk</button>
    <button data-add="bookcase">Bookcase</button>
    <button data-add="floorlamp">Floor lamp</button>
    <button data-add="rug">Rug</button>
    <button data-add="plant">Plant</button>
    <button data-add="plantsmall">Small plant</button>
  </div>
</div>

<div id="morePop" class="glass pop" role="menu" aria-label="More" hidden>
  <div class="pop-grid">
    <button id="bRotate" title="Rotate selected (or double-click it)">⟳ Rotate</button>
    <button id="bDelete">✕ Delete</button>
    <button id="bCam" title="Which camera watches your hands (the headset always uses the back camera)">📷 Front</button>
    <button id="bGyro" title="Look around by moving the phone">Gyro</button>
    <button id="bDebug" title="Wall overlay + alignment controls">Debug</button>
  </div>
</div>

<script type="module" src="app.js"></script>
<script type="module" src="lighting.js"></script>
<script type="module" src="fit.js"></script>
<script type="module" src="staging.js"></script>
<script type="module" src="agent.js"></script>
<script type="module" src="picker.js"></script>
<script type="module" src="ui.js"></script>
</body>
</html>
